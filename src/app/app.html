<div class="flex h-screen w-full bg-[#FAFBFD] overflow-hidden">
  <!-- Executive Sidebar -->
  <app-sidebar></app-sidebar>

  <!-- Main Application Content Area -->
  <div class="flex-1 flex flex-col min-w-0 h-screen overflow-hidden">
    <!-- Top Navbar -->
    <app-navbar 
      (onNewTask)="openNewTaskModal()" 
      (onNewRequest)="openNewRequestModal()"
    ></app-navbar>

    <!-- Scrollable Router Body -->
    <main class="flex-1 overflow-y-auto p-6 md:p-8 bg-[#FAFBFD]">
      <div class="max-w-7xl mx-auto">
        <router-outlet 
          (activate)="onActivateChild($event)"
        ></router-outlet>
      </div>
    </main>
  </div>

  <!-- Global Modals & Toasts -->
  <app-task-modal 
    [(isOpen)]="isTaskModalOpen"
  ></app-task-modal>

  <app-request-modal 
    [(isOpen)]="isRequestModalOpen"
  ></app-request-modal>

  <app-toast></app-toast>
</div>
